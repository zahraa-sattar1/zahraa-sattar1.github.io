name: Deploy Firebase Backend

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "firebase/**"
      - ".github/workflows/deploy-firebase-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: npm ci

      - name: Deploy functions, rules, and indexes
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase use "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
          firebase deploy --only functions,firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN"
